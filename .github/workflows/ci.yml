name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate Skills & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md frontmatter and structure
        run: |
          python3 - <<'EOF'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          skills_json = root / "skills.json"
          if not skills_json.is_file():
              sys.exit("Missing root skills.json")
          json.loads(skills_json.read_text(encoding="utf-8"))

          skill_dirs = sorted(
              p for p in root.iterdir()
              if p.is_dir() and not p.name.startswith(".")
          )
          if not skill_dirs:
              sys.exit("No skill directories found at repository root")

          name_re = re.compile(r"^[a-z0-9]+(?:-[a-z0-9]+)*$")
          errors = []

          for skill_dir in skill_dirs:
              skill_md = skill_dir / "SKILL.md"
              if not skill_md.is_file():
                  errors.append(f"{skill_dir.name}: missing SKILL.md")
                  continue

              text = skill_md.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  errors.append(f"{skill_md}: missing opening YAML frontmatter delimiter '---'")
                  continue

              parts = text.split("\n---\n", 1)
              if len(parts) != 2:
                  errors.append(f"{skill_md}: missing closing YAML frontmatter delimiter '---'")
                  continue

              frontmatter = parts[0][4:]
              name_match = re.search(r"^name:\s*(.+)$", frontmatter, re.MULTILINE)
              desc_match = re.search(r"^description:\s*(.+)$", frontmatter, re.MULTILINE)

              if not name_match:
                  errors.append(f"{skill_md}: missing 'name' in frontmatter")
              else:
                  skill_name = name_match.group(1).strip().strip("'\"")
                  if not name_re.match(skill_name):
                      errors.append(f"{skill_md}: name '{skill_name}' must be lowercase hyphenated")
                  if skill_name != skill_dir.name:
                      errors.append(
                          f"{skill_md}: frontmatter name '{skill_name}' does not match directory '{skill_dir.name}'"
                      )

              if not desc_match:
                  errors.append(f"{skill_md}: missing 'description' in frontmatter")

          if errors:
              for err in errors:
                  print(f"ERROR: {err}", file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(skill_dirs)} skill(s): {', '.join(d.name for d in skill_dirs)}")
          EOF

      - name: Run skill unit tests
        run: |
          set -euo pipefail
          for test_dir in */tests; do
            if [ -d "$test_dir" ]; then
              echo "=== Running unit tests in $test_dir ==="
              python3 -B -m unittest discover -s "$test_dir" -v
            fi
          done
